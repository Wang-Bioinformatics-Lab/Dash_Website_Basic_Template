version: '3'
services:
  template-dash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template-dash
    volumes:
      - ./logs:/app/logs:rw
    ports:
    - "5000:5000"
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    command: /bin/bash -c "source activate python312 && /app/run_server.sh"
    environment:
      VIRTUAL_HOST: template.gnps2.org
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: template.gnps2.org
      LETSENCRYPT_EMAIL: mingxun.wang@cs.ucr.eduu
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  template-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template-worker
    volumes:
      - ./logs:/app/logs:rw
    command: /bin/bash -c "source activate python312 && /app/run_worker.sh"
    restart: unless-stopped
    depends_on: 
      - template-redis
      - template-rabbitmq
    networks:
      - default
      - nginx-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  template-rabbitmq:
    container_name: template-rabbitmq
    image: rabbitmq
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  template-redis:
    container_name: template-redis
    image: redis
    networks:
      - default
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


networks:
  nginx-net:
    external:
      name: nginx-net