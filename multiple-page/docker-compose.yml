version: '3'
services:
  template-multiple-dash:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template-multiple-dash
    volumes:
      - ./logs:/app/logs:rw
    ports:
    - "5000:5000"
    networks:
      - default
      - nginx-net
    restart: unless-stopped
    command: /bin/bash -c "source activate python312 && /app/run_server.sh"
    environment:
      VIRTUAL_HOST: template.gnps2.org
      VIRTUAL_PORT: 5000
      LETSENCRYPT_HOST: template.gnps2.org
      LETSENCRYPT_EMAIL: mingxun.wang@cs.ucr.edu
    deploy:
      resources:
        limits:
          memory: 8000M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nginx-net:
    external:
      name: nginx-net